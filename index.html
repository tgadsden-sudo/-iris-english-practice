var AREAS={word:['meanings','antonyms','synonyms','homophones','wordbuild','context'],grammar:['parts','connectives','tenses','speech','voice'],sentence:['punctuation','apostrophes','spelling','mistakes','jumbled'],reading:['reading']};
var LABELS={meanings:'Double meanings',antonyms:'Antonyms',synonyms:'Synonyms',homophones:'Homophones',wordbuild:'Word building',context:'In context',parts:'Parts of speech',connectives:'Prepositions & links',tenses:'Tenses & agreement',speech:'Speech',voice:'Active / passive',punctuation:'Punctuation',apostrophes:'Apostrophes',spelling:'Spelling',mistakes:'Spot the mistake',jumbled:'Sentence order',reading:'Comprehension'};
var LEVELDESC={warmup:'Everyday vocabulary and core skills',tricky:'More precise language and grammar',expert:'Subtle vocabulary and harder sentence choices',mixed:'A surprise mix from all three levels'};
var area='word',mode='meanings',level='warmup',items=[],pos=0,score=0,answered=false,cells=[],selected=null,best={};
function $(id){return document.getElementById(id)}
function shuffle(a){var x=a.slice(),i,j,t;for(i=x.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=x[i];x[i]=x[j];x[j]=t}return x}
function strip(s){var d=document.createElement('div');d.innerHTML=s;return (d.textContent||d.innerText||'').replace(/\s+/g,' ').trim()}
function key(){return mode+'|'+level}
function bankFor(l){
  var out=[],i,r;
  if(mode==='meanings'){for(i=0;i<DATA.D[l].length;i++){r=DATA.D[l][i];out.push({type:'double',a:r[0],b:r[1],answer:r[2]})}return out}
  if(mode==='antonyms'){for(i=0;i<DATA.A[l].length;i++){r=DATA.A[l][i];out.push({type:'spell',prompt:'Write the opposite of <span class="focus">'+r[0]+'</span>.',answer:r[1]})}return out}
  if(!DATA.B[mode]||!DATA.B[mode][l])return out;
  for(i=0;i<DATA.B[mode][l].length;i++){r=DATA.B[mode][l][i];out.push({type:'mcq',prompt:r[0],options:r[1],answer:r[2],title:r[3]||'',passage:r[4]||''})}return out;
}
function buildItems(){var pool=[],ls=['warmup','tricky','expert'],i;if(level==='mixed'){for(i=0;i<ls.length;i++)pool=pool.concat(bankFor(ls[i]))}else pool=bankFor(level);pool=shuffle(pool);var n=(mode==='meanings'||mode==='antonyms')?10:(level==='mixed'?8:4);return pool.slice(0,Math.min(n,pool.length))}
function syncControls(){
  var abs=document.querySelectorAll('.area'),i,bars=document.querySelectorAll('.modebar');
  for(i=0;i<abs.length;i++)abs[i].setAttribute('aria-selected',abs[i].getAttribute('data-area')===area?'true':'false');
  for(i=0;i<bars.length;i++)bars[i].className='modebar'+(bars[i].id==='modes-'+area?'':' hidden');
  var ms=document.querySelectorAll('.mode');for(i=0;i<ms.length;i++)ms[i].setAttribute('aria-selected',ms[i].getAttribute('data-mode')===mode?'true':'false');
  $('levelDesc').textContent=LEVELDESC[level];$('tag').textContent=LABELS[mode];
}
function updateBest(){var v=best[key()];$('best').textContent=v==null?'best —':'best ★ '+v}
function start(){items=buildItems();pos=0;score=0;answered=false;cells=[];selected=null;$('score').textContent='★ 0';$('endScreen').className='end';$('quizCard').style.display='';syncControls();updateBest();render()}
function render(){
  answered=false;cells=[];selected=null;var q=items[pos],qa=$('questionArea');$('feedback').className='feedback';$('feedback').innerHTML='';$('actions').innerHTML='';
  if(!q){qa.innerHTML='<p class="prompt">No questions are available for this practice.</p>';return}
  $('progressNum').textContent='Question '+(pos+1)+' of '+items.length;$('progressSub').textContent=(q.type==='mcq'?'choose the best answer':'spell the answer');qa.innerHTML='';
  if(q.passage){var p=document.createElement('div');p.className='passage';p.innerHTML=(q.title?'<b>'+q.title+'</b><br>':'')+q.passage;qa.appendChild(p)}
  var pr=document.createElement('p');pr.className='prompt';pr.innerHTML=q.type==='double'?'What one word fits <b>both</b> clues?':(q.prompt||'Choose the best answer.');qa.appendChild(pr);
  if(q.type==='double'){var d=document.createElement('div');d.className='dual';d.innerHTML='<div class="clue"><span class="num">1</span><div class="ct">'+q.a+'</div></div><div class="clue"><span class="num">2</span><div class="ct">'+q.b+'</div></div>';qa.appendChild(d);renderSpell(qa,q)}
  else if(q.type==='spell')renderSpell(qa,q);else renderChoices(qa,q);
}
function renderSpell(qa,q){var box=document.createElement('div');box.className='cells'+(q.answer.length>=8?' long':'');var i,inp;for(i=0;i<q.answer.length;i++){inp=document.createElement('input');inp.className='cell';inp.maxLength=1;inp.type='text';inp.setAttribute('autocomplete','off');inp.setAttribute('autocapitalize','characters');inp.setAttribute('aria-label','Letter '+(i+1)+' of '+q.answer.length);(function(index,x){x.oninput=function(){var v=x.value.replace(/[^a-zA-Z]/g,'');x.value=v.slice(-1).toUpperCase();if(x.value&&index<cells.length-1)cells[index+1].focus()};x.onkeydown=function(e){if(e.key==='Backspace'&&!x.value&&index>0){cells[index-1].value='';cells[index-1].focus();e.preventDefault()}else if(e.key==='Enter')check(q)}})(i,inp);box.appendChild(inp);cells.push(inp)}qa.appendChild(box);var h=document.createElement('button');h.className='btn hint';h.textContent='Hint';h.onclick=function(){hint(q)};var c=document.createElement('button');c.className='btn primary';c.textContent='Check';c.onclick=function(){check(q)};$('actions').appendChild(h);$('actions').appendChild(c);setTimeout(function(){if(cells[0])cells[0].focus()},40)}
function renderChoices(qa,q){var wrap=document.createElement('div');wrap.className='choices';var opts=shuffle(q.options),i,b;for(i=0;i<opts.length;i++){b=document.createElement('button');b.className='choice';b.innerHTML=opts[i];b.setAttribute('data-answer',strip(opts[i]));b.onclick=function(){if(answered)return;var bs=wrap.querySelectorAll('.choice'),j;for(j=0;j<bs.length;j++)bs[j].classList.remove('selected');this.classList.add('selected');selected=this};wrap.appendChild(b)}qa.appendChild(wrap);var c=document.createElement('button');c.className='btn primary';c.textContent='Check';c.onclick=function(){check(q)};$('actions').appendChild(c)}
function hint(q){if(answered||!cells.length)return;var i;for(i=0;i<cells.length;i++)if(!cells[i].value)break;if(i>=cells.length)i=cells.length-1;cells[i].value=q.answer.charAt(i).toUpperCase();if(i<cells.length-1)cells[i+1].focus()}
function check(q){if(answered)return;var correct=false,i,guess,bs;if(q.type==='mcq'){if(!selected){$('feedback').className='feedback bad';$('feedback').textContent='Choose an answer first.';return}answered=true;correct=strip(selected.innerHTML)===strip(q.answer);bs=document.querySelectorAll('.choice');for(i=0;i<bs.length;i++){bs[i].disabled=true;if(strip(bs[i].innerHTML)===strip(q.answer))bs[i].classList.add('ok');else if(bs[i]===selected)bs[i].classList.add('no')}}else{guess='';for(i=0;i<cells.length;i++)guess+=cells[i].value;if(guess.length<q.answer.length){$('feedback').className='feedback bad';$('feedback').textContent='Fill in every square first.';return}answered=true;correct=guess.toLowerCase()===q.answer.toLowerCase();for(i=0;i<cells.length;i++){cells[i].disabled=true;cells[i].classList.add(cells[i].value.toLowerCase()===q.answer.charAt(i).toLowerCase()?'ok':'no')}}if(correct){score++;$('score').textContent='★ '+score;$('feedback').className='feedback good';$('feedback').textContent='Correct!'}else{$('feedback').className='feedback bad';$('feedback').innerHTML='Not this time.<span class="answer">Answer: <b>'+strip(q.answer)+'</b></span>'}showNext()}
function showNext(){$('actions').innerHTML='';var b=document.createElement('button');b.className='btn next';b.textContent=pos===items.length-1?'See my score →':'Next question →';b.onclick=next;$('actions').appendChild(b)}
function next(){pos++;if(pos>=items.length)finish();else render()}
function finish(){$('quizCard').style.display='none';var k=key(),pct=items.length?score/items.length:0;if(best[k]==null||score>best[k])best[k]=score;$('endNum').textContent=score+' / '+items.length;$('endTitle').textContent=LABELS[mode]+' complete!';$('endMsg').textContent=pct===1?'Perfect score.':pct>=.75?'Strong work. Try another level or practice.':pct>=.5?'Good practice. Have another go to beat the score.':'Review the answers and try another round.';$('endScreen').className='end show';updateBest()}
function chooseArea(a){if(!AREAS[a])return;area=a;mode=AREAS[a][0];start()}
function chooseMode(m){if(!LABELS[m])return;mode=m;start()}
function chooseLevel(l){level=l;var bs=document.querySelectorAll('.levelbar button'),i;for(i=0;i<bs.length;i++)bs[i].setAttribute('aria-selected',bs[i].getAttribute('data-level')===l?'true':'false');start()}
function init(){try{var i,bs=document.querySelectorAll('.area');for(i=0;i<bs.length;i++)bs[i].onclick=function(){chooseArea(this.getAttribute('data-area'))};bs=document.querySelectorAll('.mode');for(i=0;i<bs.length;i++)bs[i].onclick=function(){chooseMode(this.getAttribute('data-mode'))};bs=document.querySelectorAll('.levelbar button');for(i=0;i<bs.length;i++)bs[i].onclick=function(){chooseLevel(this.getAttribute('data-level'))};$('playAgain').onclick=start;start()}catch(e){$('errorBox').className='errorbox show';$('questionArea').innerHTML='<p class="prompt">The practice could not start.</p>'}}
init();
</script>
</body></html>
